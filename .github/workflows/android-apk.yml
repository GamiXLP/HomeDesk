name: Build HomeDesk Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - 3-android-app

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          sdkmanager --list_installed

      - name: Install dependencies
        run: npm ci

      - name: Build HomeDesk Web App
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: https://homedesk-smaragd.netlify.app
          VITE_PUBLIC_APP_URL: https://homedesk-smaragd.netlify.app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HomeDesk.apk
          ls -lh HomeDesk.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeDesk-Android-APK
          path: HomeDesk.apk
          if-no-files-found: error
          retention-days: 30
